# Rung 1 stabilized v2: force an exploration floor so REINFORCE can't collapse.
# Diagnosis of stab v1: norm_adv was inert early (RewardEMA scale clips to >=1.0,
# but returns <1 during the 10-15k collapse window -> normed == raw), and the
# entropy bonus was ~1000x weaker than the policy-gradient term. The policy std
# slammed to actor_min_std=0.1 (entropy floored at -5.3), after which the
# score-function gradient vanished and the actor froze (return stuck ~28).
#
# v2 levers, targeting the mechanism directly:
#  - actor_min_std 0.1 -> 0.3: sigma can't collapse, so exploration (and the
#    score-function gradient) stays alive across the whole run.
#  - actor_entropy 3e-4 -> 1e-2 (x33): discourage premature sharpening.
#  - actor_reinforce_norm_adv kept on: harmless early, stabilizes later if
#    returns grow past the scale=1.0 clip.
# Success check: actor_entropy should bottom near +1.3 (sigma=0.3), NOT -5.3;
# actor_grad_norm should not vanish; return should climb above ~28.
spike_times: 5
steps: 40000
batch_size: 16
train_ratio: 512
eval_every: 20000
eval_episode_num: 5
log_every: 5000
imag_gradient: 'reinforce'
actor_reinforce_norm_adv: True
actor_entropy: '1e-2'
actor_min_std: 0.3
