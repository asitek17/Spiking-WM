# Rung 1.5 + backward eligibility trace.
# PPO clip (epsilon=0.2, K=4 epochs) combined with backward ET (early imagination
# steps weighted more, where the world model is most reliable).
spike_times: 5
steps: 40000
batch_size: 16
train_ratio: 512
eval_every: 20000
eval_episode_num: 5
log_every: 5000
imag_gradient: 'reinforce'
ppo_epsilon: 0.2
ppo_epochs: 4
actor_et_lambda: 0.95
actor_et_backward: True
